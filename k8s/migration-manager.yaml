apiVersion: apps/v1
kind: Deployment
metadata:
  name: migration-manager
  namespace: default
  labels:
    app: migration-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: migration-manager
  template:
    metadata:
      labels:
        app: migration-manager
    spec:
      serviceAccountName: migration-manager
      containers:
      - name: manager
        image: kairokube-manager:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http-api
        env:
        - name: RABBITMQ_URL
          value: "amqp://guest:guest@rabbitmq:5672/"
        - name: QUEUE_NAME
          value: "microservices-queue"
        - name: MIGRATION_MODE
          value: "pod"
        - name: MIGRATION_FEASIBILITY_POLICY
          value: "warn"
        - name: CHECKPOINT_PROVIDER
          value: "kubelet"
        - name: TRANSFER_PROVIDER
          value: "file"
        - name: MAX_REPLAY_TIME
          value: "5s"
        - name: MIN_CUTOFF_TIME
          value: "1s"
        - name: MAX_CUTOFF_TIME
          value: "30s"
        - name: METRICS_WINDOW
          value: "5s"
        - name: CHECKPOINT_TIMEOUT
          value: "30s"
        - name: TRANSFER_TIMEOUT
          value: "60s"
        - name: RESTORE_TIMEOUT
          value: "60s"
        - name: SERVER_PORT
          value: "8080"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: migration-manager
  namespace: default
spec:
  selector:
    app: migration-manager
  ports:
  - port: 8080
    targetPort: 8080
    name: http-api
