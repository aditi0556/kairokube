apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
localAPIEndpoint:
  bindPort: 6443
nodeRegistration:
  criSocket: unix:///var/run/crio/crio.sock
  kubeletExtraArgs:
    feature-gates: ContainerCheckpoint=true
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
apiServer:
  extraArgs:
    feature-gates: ContainerCheckpoint=true
controllerManager:
  extraArgs:
    feature-gates: ContainerCheckpoint=true
scheduler:
  extraArgs:
    feature-gates: ContainerCheckpoint=true
