# kind cluster for real FCC/CRIU checkpoint experiments.
# Requires rootful podman in WSL2 Ubuntu with criu + iptables installed.
# Create:  KIND_EXPERIMENTAL_PROVIDER=podman kind create cluster --config k8s/kind-checkpoint.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kairokube
nodes:
  - role: control-plane
  - role: worker
  - role: worker
