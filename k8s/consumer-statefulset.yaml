apiVersion: v1
kind: Service
metadata:
  name: consumer
spec:
  clusterIP: None
  selector:
    app: consumer
  ports:
  - name: status
    port: 8081
    targetPort: 8081
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: consumer
spec:
  serviceName: "consumer"
  replicas: 2
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      containers:
      - name: consumer
        image: kairokube-consumer:latest
        imagePullPolicy: Never
        ports:
        - name: status
          containerPort: 8081
        env:
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: url
