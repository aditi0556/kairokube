apiVersion: v1
kind: ServiceAccount
metadata:
  name: migration-manager
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: migration-manager-role
rules:
  # 1. Pod operations: Discover source/target status and stop source pod at cutoff
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get", "watch"]

  # 2. Node operations: Verify target node readiness and discover node IPs
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]

  # 3. Kubelet FCC operations: Trigger container checkpointing via Kubelet proxy subresource
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get", "create"]

  # 4. StatefulSet support: Inspect controller ownership if MIGRATION_MODE=statefulset
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: migration-manager-binding
subjects:
  - kind: ServiceAccount
    name: migration-manager
    namespace: default
roleRef:
  kind: ClusterRole
  name: migration-manager-role
  apiGroup: rbac.authorization.k8s.io
